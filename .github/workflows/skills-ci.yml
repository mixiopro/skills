name: Skills CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SKILLS_CLI_VERSION: "1.7.0"

jobs:
  linux-validation:
    name: Linux skill and screenplay validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install screenplay test dependency
        run: python -m pip install --disable-pip-version-check --no-input pytest

      - name: Validate shell scripts
        run: |
          bash -n install.sh
          bash -n scripts/check-skill-count.sh
          bash -n scripts/check-screenplay-integration.sh
          bash -n scripts/check-npx-install.sh

      - name: Check whitespace errors in first-party changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$EVENT_SHA"
          elif [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$EVENT_BEFORE"
            head="$EVENT_SHA"
          else
            base="$(git rev-parse "$EVENT_SHA^" 2>/dev/null || git rev-list --max-parents=0 "$EVENT_SHA")"
            head="$EVENT_SHA"
          fi

          git diff --check "$base" "$head" -- . ':(exclude)skills/how-to-make-script/**'

      - name: Check Mixio skill tables
        run: bash scripts/check-skill-count.sh

      - name: Check owned screenplay integration
        run: bash scripts/check-screenplay-integration.sh

      - name: Validate vendored screenplay package
        working-directory: skills/how-to-make-script
        run: |
          python scripts/check_links.py .
          python scripts/validate_assets.py .
          python scripts/check_routes.py .
          python scripts/check_loading_budget.py .
          python -m pytest -q tests

      - name: Audit npx discovery and clean install
        run: bash scripts/check-npx-install.sh

  windows-installation:
    name: Windows installer and npx discovery
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = Join-Path $PWD "install.ps1"
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

          Write-Host "PowerShell syntax is valid: $path"

      - name: Audit npx discovery and clean install
        shell: pwsh
        run: |
          $package = "skills@$env:SKILLS_CLI_VERSION"
          $root = (Get-Location).Path
          $auditHome = Join-Path $env:RUNNER_TEMP ("mixio-skills-audit-" + [System.Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $auditHome | Out-Null

          $env:HOME = $auditHome
          $env:USERPROFILE = $auditHome
          $env:CODEX_HOME = (Join-Path $auditHome ".codex")
          $env:XDG_CONFIG_HOME = (Join-Path $auditHome ".config")
          $env:NPM_CONFIG_CACHE = (Join-Path $auditHome ".npm")

          function Get-SkillNames {
            param([string]$Directory)

            @(
              Get-ChildItem -LiteralPath $Directory -Directory |
                Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName "SKILL.md") } |
                Select-Object -ExpandProperty Name |
                Sort-Object
            )
          }

          function Get-PackageFiles {
            param([string]$Directory)

            $prefix = (Resolve-Path -LiteralPath $Directory).Path.TrimEnd("\") + "\"
            @(
              Get-ChildItem -LiteralPath $Directory -Recurse -File -Force |
                Where-Object {
                  $_.FullName -notmatch '[\\/](?:\.git|\.pytest_cache|__pycache__)([\\/]|$)'
                } |
                ForEach-Object { $_.FullName.Substring($prefix.Length) } |
                Sort-Object
            )
          }

          function Get-DiscoveredSkillNames {
            param([string]$Listing)

            $cleanListing = $Listing -replace "\x1B\[[0-9;?]*[ -/]*[@-~]", ""
            @(
              $cleanListing -split "`r?`n" |
                ForEach-Object {
                  $line = $_.TrimEnd()
                  if ($line -match '^│    ([a-z0-9-]+)$') { $Matches[1] }
                } |
                Sort-Object -Unique
            )
          }

          function Assert-SameList {
            param(
              [string]$Label,
              [string[]]$Expected,
              [string[]]$Actual
            )

            $difference = Compare-Object -ReferenceObject @($Expected) -DifferenceObject @($Actual)
            if ($null -ne $difference) {
              $details = $difference | Out-String
              throw "$Label differs:`n$details"
            }
          }

          $rootListing = npx --yes $package add $root --list 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Root npx discovery failed`n$rootListing" }
          $sourceSkillsRoot = Join-Path $root "skills"
          $sourceScreenplayRoot = Join-Path $sourceSkillsRoot "how-to-make-script"
          $expectedRootSkills = @(Get-SkillNames $sourceSkillsRoot)
          $discoveredRootSkills = @(Get-DiscoveredSkillNames $rootListing)
          Assert-SameList "Root npx discovery" $expectedRootSkills $discoveredRootSkills

          $fullListing = npx --yes $package add $root --full-depth --list 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Full-depth npx discovery failed`n$fullListing" }
          $discoveredFullSkills = @(Get-DiscoveredSkillNames $fullListing)
          $expectedRoutes = @(Get-SkillNames (Join-Path $sourceScreenplayRoot "skills"))
          foreach ($route in $expectedRoutes) {
            if ($discoveredFullSkills -notcontains $route) {
              throw "Full-depth npx discovery is missing exact route entry $route"
            }
          }

          npx --yes $package add $root --global --yes --agent codex --copy
          if ($LASTEXITCODE -ne 0) { throw "Clean npx install failed" }

          $installedSkillsRoot = Join-Path $auditHome ".agents\skills"
          $installedRoot = Join-Path $installedSkillsRoot "how-to-make-script"
          foreach ($file in @("SKILL.md", "UPSTREAM.md", "LICENSE")) {
            if (-not (Test-Path (Join-Path $installedRoot $file))) {
              throw "Clean npx install is missing $file"
            }
          }
          if (-not (Test-Path (Join-Path $installedSkillsRoot "mixio-screenwriting\SKILL.md"))) {
            throw "Clean npx install is missing mixio-screenwriting/SKILL.md"
          }

          $installedRootSkills = @(Get-SkillNames $installedSkillsRoot)
          Assert-SameList "Installed root skill set" $expectedRootSkills $installedRootSkills

          $sourceFiles = @(Get-PackageFiles $sourceScreenplayRoot)
          $installedFiles = @(Get-PackageFiles $installedRoot)
          Assert-SameList "Installed screenplay file set" $sourceFiles $installedFiles
          foreach ($relativePath in $sourceFiles) {
            $sourceHash = (Get-FileHash -LiteralPath (Join-Path $sourceScreenplayRoot $relativePath) -Algorithm SHA256).Hash
            $installedHash = (Get-FileHash -LiteralPath (Join-Path $installedRoot $relativePath) -Algorithm SHA256).Hash
            if ($sourceHash -ne $installedHash) {
              throw "Clean npx install differs from source: $relativePath"
            }
          }

          Write-Host "OK: skills@$env:SKILLS_CLI_VERSION discovered and installed the owned screenplay system"
