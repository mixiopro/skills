name: Public installer documents
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify public document rendering
        run: |
          bash -n install.sh scripts/test-install-public-agents.sh
          bash scripts/test-install-public-agents.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public document rendering in Windows PowerShell
        shell: powershell
        run: ./scripts/test-install-public-agents.ps1
      - name: Verify public document rendering in PowerShell 7
        shell: pwsh
        run: ./scripts/test-install-public-agents.ps1
