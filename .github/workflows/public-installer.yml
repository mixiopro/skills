name: Public installer documents
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unix-linux:
    runs-on:
      - codebuild-skills-ci-${{ github.run_id }}-${{ github.run_attempt }}
      - public-installer-linux
    steps:
      - uses: actions/checkout@v4
      - name: Verify public document rendering
        run: |
          bash -n install.sh scripts/test-install-public-agents.sh
          bash scripts/test-install-public-agents.sh

  unix-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public document rendering
        run: |
          bash -n install.sh scripts/test-install-public-agents.sh
          bash scripts/test-install-public-agents.sh

  windows:
    runs-on:
      - codebuild-skills-ci-${{ github.run_id }}-${{ github.run_attempt }}
      - "image:windows-3.0"
      - "instance-size:medium"
      - public-installer-windows
    steps:
      - uses: actions/checkout@v4
      - name: Verify public document rendering in Windows PowerShell
        shell: powershell
        run: ./scripts/test-install-public-agents.ps1
      - name: Verify public document rendering in PowerShell 7
        shell: pwsh
        run: ./scripts/test-install-public-agents.ps1
